/* ============================== INIT ============================== */
/* migration : "Adresses CMS" (cmsList) passe de cloisonné par profil à partagé entre les 4 —
   fusionne les listes de chaque profil (dédoublonnées par nom, adresse non vide prioritaire).
   v2 (corrige v1) : un profil qui n'avait jamais personnalisé sa liste voyait quand même les
   11 CMS par défaut (DEFAULT_CMS) à l'écran, sans que cette liste soit jamais écrite en
   localStorage — v1 lisait un fallback [] et perdait donc ces entrées "par défaut mais jamais
   sauvegardées" lors de la fusion. v2 relit avec DEFAULT_CMS comme fallback et fusionne dans
   la liste partagée déjà existante (rien de ce qui est déjà là n'est retiré, seulement complété). */
function migrateSharedCmsList(){
  if(localStorage.getItem('ess-cms-migrated-v2'))return;
  localStorage.setItem('ess-cms-migrated-v2','1');
  var merged=[];var byNom={};
  function add(c){
    var key=(c.nom||'').trim().toLowerCase();if(!key)return;
    if(!byNom[key]){byNom[key]=c;merged.push(c);}
    else if(!byNom[key].adresse&&c.adresse){byNom[key].adresse=c.adresse;}
  }
  ls('ess-cms',[]).forEach(add);
  PROFILES.forEach(function(p){ls('ess-'+p.id+'-cms',DEFAULT_CMS).forEach(add);});
  if(merged.length)lsSet('ess-cms',merged);
}
function loadProfileData(){
  var last=ls(pk('last'),{});
  var lastSave=ls('ess-lastSave',null);
  migrateSharedCmsList();
  S.cmsList=ls('ess-cms',DEFAULT_CMS);
  S.demarches=ls('ess-demarches',DEFAULT_DEMARCHES);
  /* fusion : ajouter les démarches par défaut manquantes sans écraser les personnalisations */
  var existingIds=S.demarches.map(function(d){return d.id;});
  var toAdd=DEFAULT_DEMARCHES.filter(function(d){return existingIds.indexOf(d.id)===-1;});
  if(toAdd.length){S.demarches=S.demarches.concat(toAdd);lsSet('ess-demarches',S.demarches);}
  S.secteurs=ls('ess-secteurs',DEFAULT_SECTEURS);
  S.templates=ls('ess-templates',DEFAULT_TEMPLATES);
  /* migration : forcer les templates builtin à la dernière version par défaut */
  var _tplV='v5-lapin-templates';
  if(ls('ess-tpl-version','')!==_tplV){
    S.templates=Object.assign({},DEFAULT_TEMPLATES);
    lsSet('ess-templates',S.templates);
    lsSet('ess-tpl-version',_tplV);
  }
  S.customTemplates=ls('ess-custom-tpl',DEFAULT_CUSTOM);
  S.customVars=ls('ess-vars',[]);
  S.hiddenBuiltinKeys=ls('ess-hidden',[]);
  S.history=ls(pk('history'),[]);
  S.yearlyStats=ls(pk('yearly-stats'),{});
  S.mandats=ls('ess-mandats',[]);
  S.orientations=ls(pk('orientations'),[]);
  S.permanences=ls(pk('permanences'),DEFAULT_PERMANENCES);
  if(ls(pk('perm-version'),'')!==PERM_MODEL_VERSION){
    S.permanences=migratePermanences(S.permanences,S.history);
    lsSet(pk('permanences'),S.permanences);
    lsSet(pk('perm-version'),PERM_MODEL_VERSION);
  }
  S.calendarType=ls('ess-caltype','google');
  S.relanceDelai=ls('ess-relance-delai',3);
  S.agendaScope='mine';
  S.selectedCMS=last.selectedCMS||"";
  S.selectedDemarche=last.selectedDemarche||"";
  S.commune=last.commune||"";
  S.saveStatus=lastSave?('Dernière sauvegarde : '+lastSave):'Données chargées';
}
var _staticListenersBound=false;
function bindStaticListenersOnce(){
  if(_staticListenersBound)return;_staticListenersBound=true;
  document.getElementById('btnDark').addEventListener('click',toggleDark);
  document.getElementById('btnData').addEventListener('click',function(){S.modal='data';renderModal();});
  document.getElementById('btnProfile').addEventListener('click',showProfileSelect);
  if(window.matchMedia){
    var agendaCompact=window.matchMedia('(max-width:900px)');
    var updateAgendaLayout=function(){if(S.activeTab==='agenda')renderAgenda();};
    if(agendaCompact.addEventListener)agendaCompact.addEventListener('change',updateAgendaLayout);
    else if(agendaCompact.addListener)agendaCompact.addListener(updateAgendaLayout);
  }
  document.addEventListener('keydown',function(e){
    var ctrl=e.ctrlKey||e.metaKey;
    if(ctrl&&e.key==='Enter'){e.preventDefault();if(S.generatedBody)copyBody();else if(canGenerate())handleGenerate();}
    if(ctrl&&e.shiftKey&&(e.key==='G'||e.key==='g')){e.preventDefault();if(canGenerate())handleGenerate();}
  });
}
/* rappel des RDV en attente depuis >3j au lancement, une fois par jour et par profil */
function maybeShowOverdueReminder(){
  var todayStr=toLocalDateStr(new Date());
  if(localStorage.getItem(pk('overdue-reminder-date'))===todayStr)return;
  var overdue=S.history.filter(function(h){return isInMyAgenda(h)&&isDepasse(h);});
  localStorage.setItem(pk('overdue-reminder-date'),todayStr);
  if(!overdue.length)return;
  S.overdueReminder=overdue;
  S.modal='rappel-overdue';
  renderModal();
}
function enterApp(){
  document.getElementById('profile-root').style.display='none';
  document.getElementById('app-root').style.display='flex';
  loadProfileData();
  regen();
  renderAll();
  initTheme();
  bindStaticListenersOnce();
  /* vérification silencieuse au démarrage */
  setTimeout(ghCheckOnStartup,2000);
  setTimeout(maybeShowOverdueReminder,600);
}
function activateProfile(id){
  S.activeProfile=id;
  localStorage.setItem('ess-active-profile',id);
  localStorage.setItem('ess-'+id+'-lastLogin',new Date().toLocaleDateString('fr-FR'));
  enterApp();
}
function init(){
  var active=localStorage.getItem('ess-active-profile');
  if(active&&PROFILES.some(function(p){return p.id===active;})){
    S.activeProfile=active;
    enterApp();
  } else {
    showProfileSelect();
  }
}
/* appliquer le thème avant le rendu pour éviter le flash */
(function(){var d=localStorage.getItem('ess-dark')==='1';document.documentElement.setAttribute('data-theme',d?'dark':'');})();
document.addEventListener('DOMContentLoaded',init);
