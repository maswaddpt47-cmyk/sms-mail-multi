<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMS &amp; MAIL — Espace conseiller</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4c51c6">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SMS & MAIL">
<style>
  /* Plus Jakarta Sans hébergée dans le dépôt (fonts/, licence OFL) au lieu de Google Fonts :
     plus d'adresse IP transmise à Google à chaque ouverture (audit RGPD du 01/10/2026, 10/10/2026) */
  @font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;}
  @font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/plus-jakarta-sans-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--c-bg);color:var(--c-text);-webkit-font-smoothing:antialiased;height:100%;}
  ::selection{background:oklch(0.9 0.06 266);}
  @keyframes flyUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(14px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}
  .ag-depasse,.ag-apointer{animation:blink 1.4s ease-in-out infinite;}
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  #stat-tooltip{position:fixed;z-index:300;pointer-events:none;padding:7px 11px;border-radius:10px;font-size:12px;font-weight:600;color:#fff;background:oklch(0.22 0.02 264 / .95);box-shadow:0 4px 18px oklch(0.1 0.02 264 / .35);white-space:nowrap;display:none;max-width:240px;white-space:normal;line-height:1.4;}
  .gx-scroll::-webkit-scrollbar{width:9px;height:9px;}
  .gx-scroll::-webkit-scrollbar-thumb{background:oklch(0.86 0.01 256);border-radius:9px;border:2px solid transparent;background-clip:padding-box;}
  .gx-scroll::-webkit-scrollbar-thumb:hover{background:oklch(0.78 0.015 256);background-clip:padding-box;}
  .gx-in{transition:border-color .18s,box-shadow .18s,background .18s;}
  .gx-in:hover{border-color:oklch(0.8 0.02 264)!important;}
  .gx-in:focus{outline:none;border-color:oklch(0.55 0.16 266)!important;box-shadow:0 0 0 4px oklch(0.55 0.16 266 / .13)!important;}
  .gx-press{transition:transform .12s cubic-bezier(.34,1.4,.64,1),box-shadow .2s,background .2s,color .2s,border-color .2s;}
  .gx-press:active{transform:scale(.97);}
  .gx-lift{transition:transform .18s,box-shadow .2s,border-color .18s;}
  .gx-lift:hover{transform:translateY(-2px);}
  .gx-card{animation:flyUp .4s cubic-bezier(.2,.7,.3,1) both;}
  button{font-family:inherit;}

  /* ===== MANDAT DOCUMENT ===== */
  #mandat-doc{background:#fff;color:#1a1a1a;font-family:'Plus Jakarta Sans',serif;}
  #mandat-doc .m-page{max-width:780px;margin:0 auto;padding:38px 46px;}
  #mandat-doc h1{font-size:17px;font-weight:800;line-height:1.35;margin:0 0 4px;}
  #mandat-doc p{font-size:12.5px;line-height:1.6;margin:0 0 11px;text-align:justify;}
  #mandat-doc ul{margin:0 0 12px;padding-left:18px;}
  #mandat-doc li{font-size:12px;line-height:1.55;margin-bottom:3px;}
  #mandat-doc .m-logo{display:flex;align-items:center;gap:12px;margin-bottom:22px;border-bottom:2px solid #2f3a8f;padding-bottom:14px;}
  #mandat-doc .m-logo .m-mark{width:46px;height:46px;border-radius:11px;background:linear-gradient(145deg,#3949ab,#283593);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:800;flex-shrink:0;}
  #mandat-doc .m-logo .m-brand{font-weight:800;font-size:15px;color:#283593;letter-spacing:-.01em;}
  #mandat-doc .m-logo .m-sub{font-size:11px;color:#666;font-weight:500;}
  #mandat-doc .m-sign{display:flex;justify-content:space-between;margin-top:34px;font-size:12.5px;}
  #mandat-doc .m-sign div{width:46%;}
  #mandat-doc .m-sign .m-line{margin-top:46px;border-top:1px solid #999;}

  /* ===== RESPONSIVE GLOBAL ===== */
  .gen-grid{display:flex;flex-direction:column;gap:20px;max-width:1180px;margin:0 auto;padding:clamp(14px,3vw,32px) clamp(12px,4vw,40px);}
  @media(min-width:720px){.gen-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:28px;align-items:start;}}
  .gen-preview{position:static;}
  @media(min-width:720px){.gen-preview{position:sticky;top:136px;}}
  .gen-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  @media(min-width:420px){.gen-type-grid{grid-template-columns:1fr 1fr 1fr 1fr;}}
  .gen-row1{display:grid;grid-template-columns:80px 1fr;gap:9px;}
  @media(min-width:400px){.gen-row1{grid-template-columns:80px 1fr 1fr;}}
  .mandat-grid{display:flex;flex-direction:column;gap:20px;max-width:1180px;margin:0 auto;padding:clamp(14px,3vw,32px) clamp(12px,4vw,40px);}
  @media(min-width:720px){.mandat-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:28px;align-items:start;}}
  /* ===== STATS RESPONSIVE ===== */
  .stats-kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
  @media(min-width:480px){.stats-kpi{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));}}
  .stats-grid{display:flex;flex-direction:column;gap:16px;margin-bottom:16px;}
  @media(min-width:640px){.stats-grid{display:grid;grid-template-columns:1fr 1fr;}}
  .stats-bar-label{font-size:11px;font-weight:600;flex-shrink:0;width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--c-dim);}
  @media(min-width:400px){.stats-bar-label{width:90px;font-size:12px;}}
  .stats-bar-val{font-size:11px;font-weight:700;flex-shrink:0;text-align:right;}
  @media(min-width:400px){.stats-bar-val{font-size:12px;}}

  .mandat-row1{display:grid;grid-template-columns:90px 1fr;gap:9px;}
  .hdr-btn{cursor:pointer;font-family:inherit;font-weight:600;font-size:11px;padding:7px 10px;border-radius:11px;white-space:nowrap;}
  @media(min-width:480px){.hdr-btn{font-size:13px;padding:9px 15px;}}
  .tab-pane-inner{max-width:1180px;margin:0 auto;padding:clamp(14px,3vw,32px) clamp(12px,4vw,40px);}

  /* ===== DARK MODE ===== */
  :root{
    --c-bg:oklch(0.968 0.008 256);--c-card:#fff;--c-input:#fff;
    --c-border:oklch(0.92 0.008 256);--c-border-in:oklch(0.89 0.01 256);
    --c-text:oklch(0.26 0.03 264);--c-muted:oklch(0.6 0.02 264);
    --c-subtle:oklch(0.55 0.02 264);--c-dim:oklch(0.5 0.02 264);
    --c-header:oklch(0.93 0.035 300 / .9);--c-nav:#fff;--c-border-ch:oklch(0.91 0.01 256);
    --c-hover:oklch(0.94 0.006 256);--c-subtle-bg:oklch(0.97 0.005 256);
  }
  [data-theme="dark"]{
    --c-bg:oklch(0.13 0.015 264);--c-card:oklch(0.19 0.015 264);--c-input:oklch(0.23 0.015 264);
    --c-border:oklch(0.3 0.015 264);--c-border-in:oklch(0.33 0.015 264);
    --c-text:oklch(0.92 0.008 264);--c-muted:oklch(0.65 0.015 264);
    --c-subtle:oklch(0.62 0.015 264);--c-dim:oklch(0.72 0.015 264);
    --c-header:oklch(0.2 0.05 300 / .95);--c-nav:oklch(0.17 0.015 264);--c-border-ch:oklch(0.35 0.015 264);
    --c-hover:oklch(0.25 0.015 264);--c-subtle-bg:oklch(0.22 0.015 264);
  }
  /* éléments statiques */
  [data-theme="dark"] body{background:var(--c-bg)!important;color:var(--c-text)!important;}
  [data-theme="dark"] header{background:var(--c-header)!important;border-color:var(--c-border)!important;}
  [data-theme="dark"] #tabnav{background:var(--c-nav)!important;border-color:var(--c-border)!important;}
  /* surcharges inline */
  [data-theme="dark"] [style*="background:var(--c-card)"]{background:var(--c-card)!important;}
  [data-theme="dark"] [style*="color:var(--c-muted)"]{color:var(--c-muted)!important;}
  [data-theme="dark"] [style*="color:var(--c-subtle)"]{color:var(--c-subtle)!important;}
  [data-theme="dark"] [style*="color:var(--c-subtle)"]{color:var(--c-subtle)!important;}
  [data-theme="dark"] [style*="color:var(--c-muted)"]{color:var(--c-muted)!important;}
  [data-theme="dark"] [style*="color:var(--c-dim)"]{color:var(--c-dim)!important;}
  [data-theme="dark"] [style*="color:var(--c-dim)"]{color:var(--c-dim)!important;}
  [data-theme="dark"] [style*="color:oklch(0.4 0.03 264)"]{color:var(--c-dim)!important;}
  [data-theme="dark"] [style*="color:var(--c-dim)"]{color:var(--c-dim)!important;}
  [data-theme="dark"] [style*="color:oklch(0.26 0.03 264)"]{color:var(--c-text)!important;}
  [data-theme="dark"] [style*="border:1px solid var(--c-border)"]{border-color:var(--c-border)!important;}
  [data-theme="dark"] [style*="border:1.5px solid var(--c-border-in)"]{border-color:var(--c-border-in)!important;}
  [data-theme="dark"] [style*="border:2px solid oklch(0.91 0.01 256)"]{border-color:var(--c-border)!important;}
  [data-theme="dark"] [style*="border:1px solid oklch(0.88"]{border-color:var(--c-border)!important;}
  [data-theme="dark"] [style*="border:1px solid oklch(0.82"]{border-color:var(--c-border)!important;}
  [data-theme="dark"] [style*="border:1px solid oklch(0.89"]{border-color:var(--c-border)!important;}
  [data-theme="dark"] [style*="background:oklch(0.97"]{background:var(--c-subtle-bg)!important;}
  [data-theme="dark"] [style*="background:var(--c-hover)"]{background:var(--c-hover)!important;}
  [data-theme="dark"] [style*="background:var(--c-hover)"]{background:var(--c-hover)!important;}
  [data-theme="dark"] [style*="background:var(--c-hover)"]{background:var(--c-hover)!important;}
  [data-theme="dark"] [style*="background:var(--c-hover)"]{background:var(--c-hover)!important;}
  [data-theme="dark"] [style*="background:oklch(0.96 0.025 266)"]{background:oklch(0.25 0.06 266)!important;}
  [data-theme="dark"] [style*="background:oklch(0.96 0.03 25)"]{background:oklch(0.22 0.04 25)!important;}
  [data-theme="dark"] [style*="background:oklch(0.968 0.008 256)"]{background:var(--c-bg)!important;}
  [data-theme="dark"] [style*="background:var(--c-hover)"]{background:oklch(0.22 0.015 264)!important;}
  [data-theme="dark"] [style*="background:oklch(0.985"]{background:var(--c-header)!important;}
  /* modal & toast */
  [data-theme="dark"] .gx-modal [style*="background:var(--c-card)"]{background:var(--c-card)!important;}
  [data-theme="dark"] [style*="background:oklch(0.2 0.03 264"]{background:oklch(0.05 0.02 264 / .7)!important;}
  /* mandat doc reste blanc pour impression */
  [data-theme="dark"] #mandat-doc,[data-theme="dark"] #mandat-doc *{background:#fff!important;color:#1a1a1a!important;border-color:#e0e0e0!important;}
  /* scrollbar dark */
  [data-theme="dark"] .gx-scroll::-webkit-scrollbar-thumb{background:oklch(0.35 0.015 264);}

  /* ===== PRINT ===== */
  @media print{
    body{background:#fff;}
    #app-root>header,#app-root>nav,#app-root .no-print,.gx-toast,.gx-modal{display:none !important;}
    main{overflow:visible !important;}
    .tab-pane{display:none !important;}
    #pane-mandat{display:block !important;padding:0 !important;}
    #pane-mandat>div{display:block !important;padding:0 !important;margin:0 !important;grid-template-columns:1fr !important;}
    #mandat-form-wrap{display:none !important;}
    #mandat-doc-wrap{display:block !important;box-shadow:none !important;border:none !important;padding:0 !important;margin:0 !important;overflow:visible !important;border-radius:0 !important;width:100% !important;}
    #mandat-doc{box-shadow:none;width:100% !important;}
    #mandat-doc .m-page{max-width:100%;padding:0;}
    #mandat-doc .m-sign{page-break-inside:avoid;}
    #mandat-doc .m-line{margin-top:28px;}
    @page{size:A4;margin:16mm;}
  }

  /* ===== INTERFACE CONSEILLER — SANDBOX UI ===== */
  :root{--c-bg:#f5f7f9;--c-text:#182b3a;--c-dim:#465c6a;--c-muted:#647582;--c-subtle:#586d7b;--c-border:#dfe7ec;--c-border-in:#cad5dd;--c-hover:#eef3f5;--c-subtle-bg:#f7fafb;--ui-accent:#087f75;--ui-accent-soft:#e8f5f2;--ui-ink:#112e40;--ui-shadow:0 2px 5px #112e4004,0 8px 24px #112e4004;}
  [data-theme="dark"]{--c-bg:#101c24;--c-text:#e0eaf0;--c-dim:#bdcdd6;--c-muted:#99afb9;--c-subtle:#adc1ca;--c-border:#344653;--c-border-in:#435762;--c-hover:#233641;--c-subtle-bg:#1c2d37;--ui-accent:#7bd8c5;--ui-accent-soft:#193e3c;--ui-ink:#d9e9ee;--ui-shadow:none;}
  body{line-height:1.5;}
  button,a,input,select,textarea{touch-action:manipulation;}
  button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ui-accent);outline-offset:3px;}
  .gx-in:focus{border-color:var(--ui-accent)!important;box-shadow:0 0 0 3px var(--ui-accent-soft)!important;}
  .gx-lift:hover{transform:none;}
  .skip-link{position:fixed;left:16px;top:-100px;z-index:1000;background:var(--c-card);color:var(--c-text);padding:12px 18px;border-radius:8px;}
  .skip-link:focus{top:12px;}
  .workspace-shell{display:grid;grid-template-columns:226px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);height:100%;min-height:0;}
  .workspace-sidebar{grid-column:1;grid-row:1 / -1;background:#112e40;color:#eaf2f5;display:flex;flex-direction:column;min-height:0;padding:29px 16px 20px;}
  .sidebar-brand{display:flex;align-items:center;gap:11px;padding:0 10px 30px;}
  .brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#1c9988;color:#fff;font-size:25px;font-weight:600;flex-shrink:0;}
  .brand-name{font-size:17px;font-weight:800;letter-spacing:-.6px;}
  .brand-subtitle{font-size:10px;color:#afc5d0;letter-spacing:.11em;margin-top:1px;text-transform:uppercase;}
  #tabnav{display:flex;flex-direction:column;gap:5px;overflow-y:auto;min-height:0;flex:1;scrollbar-width:thin;}
  .nav-group-label{font-size:10px;font-weight:700;letter-spacing:.12em;color:#a9c0cc;padding:7px 13px 9px;}
  .nav-group-label:not(:first-child){margin-top:18px;}
  .workspace-nav-button{display:flex;align-items:center;gap:11px;min-height:44px;padding:11px 13px;border:0;border-radius:8px;background:transparent;color:#bfd0d9;font-family:inherit;font-size:12px;font-weight:600;line-height:1.4;text-align:left;cursor:pointer;white-space:nowrap;}
  .workspace-nav-button:hover{background:#ffffff0c;color:#fff;}
  .workspace-nav-button[aria-current="page"]{background:#254b59;color:#fff;box-shadow:inset 3px 0 #5fceba;}
  .workspace-nav-button svg{width:18px;height:18px;flex-shrink:0;opacity:.9;}
  .workspace-nav-button .nav-label{flex:1;}
  .workspace-nav-button>span:not(.nav-label){flex-shrink:0;}
  .sidebar-footer{border-top:1px solid #ffffff16;margin:22px 10px 0;padding-top:17px;font-size:10px;line-height:1.8;color:#acc1cc;}
  .sidebar-footer strong{display:block;font-size:11px;color:#d7e5eb;font-weight:600;}
  .workspace-topbar{grid-column:2;grid-row:1;display:flex;align-items:center;gap:16px;padding:17px 32px;min-height:78px;border-bottom:1px solid var(--c-border);background:var(--c-card)!important;}
  .workspace-breadcrumb{font-size:12px;color:var(--c-muted);}
  .workspace-breadcrumb strong{color:var(--c-text);font-weight:600;}
  .workspace-mobile-brand{display:none;}
  .topbar-tools{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0;}
  .workspace-topbar #btnProfile{border:1px solid var(--c-border);box-shadow:none;min-height:36px;font-size:12px;padding:8px 12px;border-radius:8px;}
  .workspace-topbar #btnDark{width:36px;height:36px;border:1px solid var(--c-border);background:var(--c-card);color:var(--c-text);border-radius:8px;font-size:17px;cursor:pointer;}
  .workspace-topbar #btnData{display:flex;align-items:center;gap:7px;background:var(--ui-ink);color:var(--c-card);border:0;border-radius:8px;box-shadow:none;font-size:12px;padding:9px 13px;cursor:pointer;}
  #gh-banner-root{grid-column:2;grid-row:2;min-width:0;}
  #gh-banner-root>div{flex-wrap:wrap;}
  #workspace-main{grid-column:2;grid-row:3;min-width:0;min-height:0;overflow-y:auto;scrollbar-gutter:stable;}
  .workspace-pagehead{max-width:1260px;margin:auto;padding:30px 32px 23px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;}
  .page-eyebrow{color:var(--ui-accent);font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin-bottom:7px;}
  .workspace-pagehead h1{font-size:27px;font-weight:800;line-height:1.25;letter-spacing:-.9px;margin:0 0 8px;}
  .workspace-pagehead p{font-size:12px;color:var(--c-subtle);margin:0;line-height:1.7;max-width:600px;}
  .workspace-save{max-width:240px;text-align:right;color:var(--c-muted);font-size:10px;line-height:1.7;flex-shrink:0;padding-top:4px;}
  .workspace-save .save-dot{display:inline-block;width:6px;height:6px;background:#138672;border-radius:50%;margin-right:5px;}
  #rdvCounter{color:var(--ui-accent);font-weight:700;}
  .gen-grid{max-width:1260px;margin:auto;padding:0 32px 36px;gap:24px;display:grid;grid-template-columns:minmax(0,1fr) 350px;align-items:start;}
  .gen-preview{position:sticky;top:22px;}
  .gen-form{display:flex;flex-direction:column;gap:18px;min-width:0;}
  #pane-generate .gx-card{animation:none;border-radius:12px!important;box-shadow:var(--ui-shadow)!important;}
  #pane-generate section{padding:22px!important;}
  .ui-section-head{display:flex;align-items:center;gap:11px;margin-bottom:19px;}
  .ui-step{display:grid;place-items:center;width:29px;height:29px;border-radius:8px;background:var(--ui-accent-soft);color:var(--ui-accent);font-size:11px;font-weight:800;flex-shrink:0;}
  .ui-section-head h2{font-size:14px;font-weight:800;margin:0;letter-spacing:-.15px;}
  .ui-section-head p{font-size:10px;color:var(--c-muted);margin:2px 0 0;}
  .ui-form-subtitle{font-size:11px;font-weight:800;color:var(--c-text);padding:8px 0 0;border-top:1px solid var(--c-border);margin-top:3px;}
  #pane-generate label{letter-spacing:0!important;text-transform:none!important;font-size:11px!important;color:var(--c-dim)!important;}
  #pane-generate .gx-in{border-width:1px!important;border-radius:8px!important;font-size:12px!important;padding:10px 11px!important;min-width:0;min-height:39px;}
  #pane-generate .gen-row1{grid-template-columns:70px minmax(0,1fr) minmax(0,1fr);}
  .gen-row1>*{min-width:0;}
  .ui-channel-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .ui-channel{border:1px solid var(--c-border-in);border-radius:8px;padding:11px;background:var(--c-card);color:var(--c-dim);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .ui-channel[aria-pressed="true"]{border-color:var(--ui-accent);background:var(--ui-accent-soft);color:var(--ui-accent);box-shadow:inset 0 0 0 1px var(--ui-accent);}
  .gen-type-grid{grid-template-columns:1fr 1fr;gap:7px;}

"use strict";

/* ============================== HELPERS ============================== */
function el(tag, attrs, children){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="style") e.style.cssText=attrs[k];
    else if(k==="class") e.className=attrs[k];
    else if(k==="html") e.innerHTML=attrs[k];
    else if(k.startsWith("on")&&typeof attrs[k]==="function") e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else if(attrs[k]===true) e.setAttribute(k,"");
    else if(attrs[k]!==false&&attrs[k]!=null) e.setAttribute(k,attrs[k]);
  }
  if(children!=null){
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c==null||c===false) return;
      e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
    });
  }
  return e;
}

/* nombre de RDV réellement occupés aujourd'hui pour un profil (dédoublonné par créneau, hors statuts freeAgain) */
function countTodayRdv(profileId){
  var today=toLocalDateStr(new Date());
  var groups={};
  readProfileHistory(profileId).forEach(function(h){
    if(h.date!==today)return;
    var key=(h.commune||'')+'|'+h.heure;
    (groups[key]=groups[key]||[]).push(h);
  });
  var count=0;
  Object.keys(groups).forEach(function(key){
    var arr=groups[key];
    var taken=arr.filter(function(x){return x.msgType==='confirmation';})[0]||arr.filter(function(x){return x.msgType==='proposition';})[0]||arr.filter(function(x){return x.msgType==='sans_appel';})[0]||null;
    if(taken&&taken.statut!=='pas_de_retour'&&taken.statut!=='lapin'&&taken.statut!=='excuse')count++;
  });
  return count;
}

  readProfileHistory(profileId).forEach(function(h){

/* repo PRIVÉ dédié — les sauvegardes contiennent des données personnelles
   d'usagers (nom, téléphone, démarche...) et ne doivent jamais être poussées
   vers le repo public qui héberge le code/GitHub Pages */
var GH_REPO='maswaddpt47-cmyk/sms-mail-multi-backups';
var GH_BRANCH='main';
var GH_BACKUP_DIR='backups';
function ghToken(){return localStorage.getItem('ess-gh-token')||'';}
function ghHeaders(token){return{'Authorization':'token '+token,'Content-Type':'application/json','Accept':'application/vnd.github+json'};}
/* dossier de backup cloisonné par profil : backups/<profil>/ */
function ghBackupDir(pid){return GH_BACKUP_DIR+'/'+(pid||S.activeProfile);}
function ghNowFile(pid){
  var n=new Date();
  var d=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  var h=String(n.getHours()).padStart(2,'0')+String(n.getMinutes()).padStart(2,'0');
  return ghBackupDir(pid)+'/backup-'+d+'-'+h+'.json';
}
/* déclenche un backup throttlé (2 min) pour un profil donné — utilisé lors d'écritures cross-profil */
function maybeAutoBackupProfile(profileId){
  if(!ghToken())return;
  var nowMs=Date.now();
  if(nowMs-(_ghLastAutoPushByProfile[profileId]||0)>120000){
    _ghLastAutoPushByProfile[profileId]=nowMs;
    githubPush(true,null,profileId);
  }
}

/* pousse un fichier daté, puis nettoie les anciens (garde GH_BACKUP_RETENTION_JOURS) */
function githubPush(silent,onSuccess,pid){
  pid=pid||S.activeProfile;
  var token=ghToken();
  if(!token){if(!silent)showToast('⚠️ Token GitHub manquant — ajoutez-le dans Configuration','warn');return;}
  if(!silent)showToast('⏳ Sauvegarde GitHub en cours…','ok');
  var content=btoa(unescape(encodeURIComponent(JSON.stringify(exportDataForProfile(pid),null,2))));
  var file=ghNowFile(pid);
  /* chaque backup est un nouveau fichier horodaté — pas besoin de SHA */
  fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+file+'?ref='+GH_BRANCH,{headers:ghHeaders(token)})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(existing){
      var body={message:'backup: '+new Date().toLocaleString('fr-FR'),content:content,branch:GH_BRANCH};
      if(existing&&existing.sha)body.sha=existing.sha;
      return fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+file,{method:'PUT',headers:ghHeaders(token),body:JSON.stringify(body)});
    })
    .then(function(r){
      if(!r||!r.ok){
        if(!silent){
          var status=r?r.status:0;
          (r?r.json().catch(function(){return null;}):Promise.resolve(null)).then(function(errBody){
            var detail=errBody&&errBody.message?' — '+errBody.message:'';
            var hint=status===404?' (repo/branche introuvable pour ce token)':status===403||status===401?' (droits insuffisants sur ce repo)':'';
            showToast('❌ Erreur GitHub '+status+hint+detail,'err');
          });
        }
        return;
      }
      if(!silent)showToast('✅ Sauvegarde GitHub réussie !');
      localStorage.setItem(pkFor(pid,'gh-last-backup'),new Date().toISOString());
      if(pid===S.activeProfile){S._ghNewerBackup=null;renderHeader();}
      ghCleanOldBackups(token,pid);
      if(onSuccess)onSuccess();
    })
    .catch(function(){if(!silent)showToast('❌ Erreur réseau GitHub','err');});
}

/* rétention : au moins 30 jours de sauvegardes conservées par profil (même choix que SMS-mail,
   27/09/2026 : « au moins 14 jours ou plus, le maximum » — 30 j retenu comme compromis avec la
   minimisation RGPD déjà pratiquée ailleurs dans l'app). */
var GH_BACKUP_RETENTION_JOURS=30;
function ghCleanOldBackups(token,pid){
  fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+ghBackupDir(pid)+'?ref='+GH_BRANCH,{headers:ghHeaders(token)})
    .then(function(r){return r.ok?r.json():[];})
    .then(function(files){
      if(!Array.isArray(files))return;
      var backups=files.filter(function(f){return f.name.match(/^backup-\d{4}-\d{2}-\d{2}-\d{4}\.json$|^backup-\d{4}-\d{2}-\d{2}\.json$/);});
      backups.sort(function(a,b){return b.name.localeCompare(a.name);}); /* du plus récent au plus ancien */
      var cutoff=Date.now()-GH_BACKUP_RETENTION_JOURS*24*3600*1000;
      var toDelete=backups.slice(1).filter(function(f){ /* toujours garder le plus récent [0] */
        var m=f.name.match(/backup-(\d{4})-(\d{2})-(\d{2})(?:-(\d{2})(\d{2}))?\.json/);
        if(!m)return false;
        var d=new Date(+m[1],+m[2]-1,+m[3],m[4]?+m[4]:0,m[5]?+m[5]:0);
        return d.getTime()<cutoff;
      });
      /* suppressions en séquentiel (pas en parallèle) — un lot de deletes simultanés déclenche
         le rate-limit secondaire de GitHub sur les écritures rapprochées, ce qui les faisait
         échouer silencieusement et laissait les sauvegardes s'accumuler indéfiniment */
      var failed=[];
      return toDelete.reduce(function(chain,f){
        return chain.then(function(){
          return fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+f.path,{method:'DELETE',headers:ghHeaders(token),body:JSON.stringify({message:'backup: nettoyage >'+GH_BACKUP_RETENTION_JOURS+'j',sha:f.sha,branch:GH_BRANCH})})
            .then(function(r){if(!r.ok){console.warn('ghCleanOldBackups: échec suppression '+f.path+' ('+r.status+')');failed.push(f.name+' ('+r.status+')');}})
            .catch(function(e){console.warn('ghCleanOldBackups: erreur réseau suppression '+f.path,e);failed.push(f.name+' (réseau)');});
        });
      },Promise.resolve()).then(function(){
        /* signalé une fois par lot distinct, pas à chaque sauvegarde silencieuse suivante —
           cause déjà vue (SMS-mail, 27/09/2026) : une suppression bloquée sur un fichier précis
           pendant des jours sans que rien ne le signale */
        if(failed.length&&localStorage.getItem(pkFor(pid,'gh-clean-fail-seen'))!==failed.join(',')){
          localStorage.setItem(pkFor(pid,'gh-clean-fail-seen'),failed.join(','));
          if(pid===S.activeProfile)showToast('⚠️ Nettoyage des sauvegardes : '+failed.length+' suppression(s) ont échoué ('+failed[0]+(failed.length>1?'…':'')+')','warn');
        }
      });
    }).catch(function(e){console.warn('ghCleanOldBackups: échec listing',e);});
}

/* liste les backups disponibles sur GitHub (dossier du profil actif) */
function ghListBackups(token,cb){
  fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+ghBackupDir()+'?ref='+GH_BRANCH,{headers:ghHeaders(token)})
    .then(function(r){return r.ok?r.json():[];})
    .then(function(files){
      if(!Array.isArray(files)){cb([]);return;}
      var backups=files.filter(function(f){return f.name.match(/^backup-\d{4}-\d{2}-\d{2}(?:-\d{4})?\.json$/);});
      backups.sort(function(a,b){return b.name.localeCompare(a.name);});
      cb(backups);
    }).catch(function(){cb([]);});
}

function ghCheckOnStartup(){

    if(!backups.length)return;
    var latest=backups[0];
    var m=latest.name.match(/backup-(\d{4}-\d{2}-\d{2})(?:-(\d{2})(\d{2}))?\.json/);
    if(!m)return;
    var ghKey=m[1]+(m[2]&&m[3]?'-'+m[2]+m[3]:'');

      }
    }
    if(ghKey>localKey){
      /* backup GitHub plus récent que notre dernier push local (comparaison à la minute) → proposer */
      var displayDate=m[1].split('-').reverse().join('/');
      var displayTime=m[2]&&m[3]?m[2]+':'+m[3]:'';

/* ============================== TOAST ============================== */
function rdvCountdown(dateStr,heure){
  if(!dateStr||!heure)return'';
  var parts=heure.split(':');
  var rdv=new Date(dateStr+'T'+parts[0]+':'+parts[1]+':00');
  var diff=Math.floor((rdv.getTime()-Date.now())/1000);
  if(diff<0)return'';
  if(diff<3600){var mn=Math.floor(diff/60);return'dans '+mn+' min';}
  if(diff<86400){var h=Math.floor(diff/3600);return'dans '+h+'h';}
  var j=Math.floor(diff/86400);return'dans '+j+' j';
}
function timeAgo(tsStr){
  if(!tsStr)return'';
  /* parse "dd/mm/yyyy hh:mm:ss" ou "dd/mm/yyyy hh:mm" */
  var m=tsStr.match(/(\d{2})\/(\d{2})\/(\d{4})[^\d]+(\d{2}):(\d{2})/);
  if(!m)return'';
  var d=new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]);
  var diff=Math.floor((Date.now()-d.getTime())/1000);
  if(diff<60)return'à l\'instant';
  if(diff<3600){var mn=Math.floor(diff/60);return'il y a '+mn+' min';}
  if(diff<86400){var h=Math.floor(diff/3600);return'il y a '+h+'h';}
  if(diff<86400*7){var j=Math.floor(diff/86400);return'il y a '+j+' j';}
  return'';
}

function fillTemplate(tpl,v){

  var fullName=[prenomStr,nomStr].filter(Boolean).join(" ");
  var greeting="";
  if(civStr&&fullName)greeting=" "+civStr+" "+fullName;
  else if(civStr&&!fullName)greeting=" "+civStr;
  else if(!civStr&&fullName)greeting=" "+fullName;
  var dateFmt=v.date?new Date(v.date).toLocaleDateString("fr-FR",{weekday:"long",year:"numeric",month:"long",day:"numeric"}):"[date]";
  var docList=(v.documents||[]).map(function(d){return "• "+d;}).join("\n");
  var r=(tpl||"")
    .replace(/Bonjour \{civilite\} \{nom\} \{prenom\}/g,"Bonjour"+greeting)
    .replace(/Bonjour \{civilite\} \{prenom\}/g,"Bonjour"+greeting)
    .replace(/Bonjour\{civilite\} \{prenom\}/g,"Bonjour"+greeting)
    .replace(/Bonjour \{prenom\}/g,"Bonjour"+greeting)
    .replace(/Bonjour\{prenom\}/g,"Bonjour"+greeting)
    .replace(/{civilite}/g,civStr).replace(/{prenom}/g,prenomStr).replace(/{nom}/g,nomStr)
    .replace(/{prenom_nom}/g,fullName).replace(/{greeting}/g,greeting)
    .replace(/{demarche}/g,v.demarche||"[démarche]").replace(/{date}/g,dateFmt)
    .replace(/{heure}/g,v.heure||"[heure]").replace(/{adresse}/g,v.adresse||"[adresse]")
    .replace(/Si oui, pensez à apporter :\n\{documents\}/g, docList?'Si oui, pensez à apporter :\n'+docList:'')
    .replace(/Pensez à apporter :\n\{documents\}/g, docList?'Pensez à apporter :\n'+docList:'')
    .replace(/merci de prévoir les documents suivants :\n\{documents\}/g, docList?'merci de prévoir les documents suivants :\n'+docList:'')
    .replace(/{documents}/g,docList).replace(/{commune}/g,v.commune||"[commune]").replace(/{cms}/g,v.cms||v.commune||"[CMS]")
    .replace(/\n📅 Ajouter à votre calendrier : \{lienCalendrier\}/g, v.lienCalendrier ? '\n📅 Ajouter à votre calendrier : '+v.lienCalendrier : '')
    .replace(/{lienCalendrier}/g,v.lienCalendrier||"")
    .replace(/{dateDemande}/g,v.dateDemande
      ? new Date(v.dateDemande).toLocaleDateString("fr-FR",{weekday:"long",year:"numeric",month:"long",day:"numeric"})
      : "[date de proposition]");
  for(var i=0;i<S.customVars.length;i++){var cv=S.customVars[i];if(cv.nom)r=r.replace(new RegExp("\\{"+cv.nom+"\\}","g"),cv.valeur);}
  return r.replace(/Bonjour  /g,"Bonjour ").replace(/\n{3,}/g,"\n\n");
}

function buildCalLink(){
  if(!S.date||!S.heure)return '';
  var parts=S.heure.split(':');
  var startMin=parseInt(parts[0])*60+parseInt(parts[1]||0);

function addHistory(item){
  /* doublon : même date + heure + commune + nom + prénom → remplace l'existant
     (le prénom est inclus pour ne pas fusionner deux personnes de même nom sur le même créneau) */
  if(item.date&&item.heure&&item.nom){
    var di=S.history.findIndex(function(h){
      return h.date===item.date&&h.heure===item.heure&&h.commune===item.commune&&(h.nom||'').toLowerCase()===(item.nom||'').toLowerCase()&&(h.prenom||'').toLowerCase()===(item.prenom||'').toLowerCase();
    });
    if(di!==-1){
      var merged=Object.assign({},S.history[di],item);
      if(merged.body&&(!merged.statut||merged.statut==='libre'))merged.statut='en_attente';
      S.history.splice(di,1,merged);lsSet(pk('history'),S.history);ensureDayOpen(item.commune,item.date);return;
    }
  }
  if(item.body&&!item.statut)item.statut='en_attente';
  var h=[item].concat(S.history);if(h.length>HISTORY_MAX)h.pop();
  S.history=h;lsSet(pk('history'),h);
  ensureDayOpen(item.commune,item.date);
  maybeAutoBackupProfile(S.activeProfile);
  /* Rappel export tous les 5 messages */
  var since=parseInt(localStorage.getItem(pk('since-export'))||'0',10)+1;
  localStorage.setItem(pk('since-export'),since);
  if(since>0&&since%5===0)setTimeout(function(){showToast('💾 '+since+' messages non sauvegardés — pensez à exporter !','warn');},600);
}

function doCopy(text){
  return new Promise(function(resolve){
    if(!text){resolve(false);return;}
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){resolve(true);},function(){fallback();});
    } else fallback();
    function fallback(){
      try{var ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;top:0;left:0;opacity:0;";document.body.appendChild(ta);ta.focus();ta.select();document.execCommand("copy");document.body.removeChild(ta);resolve(true);}catch(e){resolve(false);}
    }
  });
}
function flashCopied(key){S.copied[key]=true;renderAll();setTimeout(function(){S.copied[key]=false;renderAll();},1800);}
function isDuplicate(nom,demarche,date){

      &&h.date===date;
  });
}
function copyBody(){

    if(!ok)return;
    if(text&&(!S.history.length||S.history[0].body!==text)){
      var r=compute();var cms=S.cmsList.find(function(c){return String(c.id)===String(S.selectedCMS);});
      if(cms&&r.dem){
        if(isDuplicate(S.nom,r.dem.nom,S.date))showToast('⚠️ Doublon détecté : '+S.nom+' / '+r.dem.nom+' déjà dans l\'historique','warn');
        addHistory({channel:S.channel,msgType:S.msgType,body:text,subject:S.generatedSubject,civilite:S.civilite,prenom:S.prenom,nom:S.nom,telephone:S.telephone,demarche:r.dem.nom,selectedDemarche:S.selectedDemarche,demarcheAutre:S.demarcheAutre,commune:S.commune,selectedCMS:S.selectedCMS,date:S.date,heure:S.heure,dateDemande:S.dateDemande||'',ts:new Date().toLocaleString('fr-FR')});
      }
    }
    flashCopied('body');showToast("✓ Copié !");
  }
  /* copie enrichie : HTML avec "cliquer sur ce lien" + fallback texte brut */
  if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write&&window.isSecureContext){
    var html=text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\n/g,'<br>')
      .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1">cliquer sur ce lien</a>');
    navigator.clipboard.write([new ClipboardItem({
      'text/plain':new Blob([text],{type:'text/plain'}),
      'text/html':new Blob([html],{type:'text/html'})
    })]).then(function(){afterCopy(true);},function(){doCopy(text).then(afterCopy);});
  } else {
    doCopy(text).then(afterCopy);
  }
}

/* plus de troncature à 10 chiffres : elle masquait un numéro trop long ou mal importé, qui
   passait alors pour valide (00 76 15 74 22 généré sans alerte, 07/10/2026) ; +33/0033 → 0 */
function formatTel(val){var d=(val||"").replace(/\D/g,'');if(/^0033/.test(d))d='0'+d.slice(4);else if(/^33\d{9}$/.test(d))d='0'+d.slice(2);return d.replace(/(\d{2})(?=\d)/g,'$1 ').trim();}
/* '' si vide ou valide (10 chiffres, 01 à 09), sinon le motif affiché sous le champ */
function telProblem(val){
  var d=(val||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.length<10)return 'Numéro incomplet ('+d.length+'/10 chiffres)';
  if(d.length>10)return 'Numéro trop long ('+d.length+' chiffres)';
  if(!/^0[1-9]/.test(d))return 'Numéro invalide : doit commencer par 01 à 09';
  return '';
}

function toLocalDateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
var PERM_MODEL_VERSION='v2-jours-a-la-volee';
/* migration : les permanences hebdomadaires (jour fixe, sans exceptDate) sont remplacées par des
   journées ouvertes à la volée (même mécanisme que les anciens "jours exceptionnels") — reconstruire
   une journée par (commune,date) réellement présente dans l'historique, pour qu'aucun RDV existant
   ne disparaisse de l'agenda ; les anciennes permanences hebdomadaires sont abandonnées. Non
   destructif : n'écrit jamais dans l'historique. Appelée au démarrage (par profil) et à l'import
   d'une sauvegarde qui contiendrait encore l'ancien format. */
function migratePermanences(perms,history){
  var kept=(perms||[]).filter(function(p){return p.exceptDate;});
  var byKey={};kept.forEach(function(p){byKey[p.commune+'|'+p.exceptDate]=true;});
  (history||[]).forEach(function(h){
    if(!h.date||!h.commune)return;
    var key=h.commune+'|'+h.date;
    if(byKey[key])return;
    byKey[key]=true;
    kept.push({id:Date.now()+Math.random(),commune:h.commune,exceptDate:h.date,debut:'09:30',fin:'16:30'});
  });
  return kept;
}
function getPermanence(commune,dateStr,permList){
  /* une journée = une entrée (commune,date) ouverte à la volée, exactement comme les
     anciens "jours exceptionnels" — plus de permanence hebdomadaire récurrente */
  permList=permList||S.permanences;
  if(!dateStr)return null;
  return permList.find(function(p){return p.commune===commune&&p.exceptDate===dateStr;})||null;
}
/* ouvre une journée à la volée si elle n'existe pas encore, pour le profil actif — appelé à
   chaque RDV/indispo enregistré (addHistory, blockSlot).
   Toujours sur la grille standard (09:30-16:30), jamais sur l'heure du RDV déclencheur : figer
   debut/fin sur cette heure rétrécit silencieusement la grille du sélecteur (bug AG-001 sur
   SMS-mail, corrigé avant même d'arriver ici). Non destructif si la journée existe déjà. */
function ensureDayOpen(commune,dateStr){
  if(!commune||!dateStr)return;
  if(S.permanences.some(function(p){return p.commune===commune&&p.exceptDate===dateStr;}))return;
  S.permanences=S.permanences.concat([{id:Date.now()+Math.random(),commune:commune,exceptDate:dateStr,debut:'09:30',fin:'16:30'}]);
  lsSet(pk('permanences'),S.permanences);
}
/* RDV confirmé dont la date est passée sans être marqué Réalisé (ni Lapin/Excusé…) :
   à pointer — même logique centralisée que isDepasse */
function isAPointer(h){
  return !!h&&h.statut==='confirme'&&h.msgType!=='indispo'&&!!h.date&&h.date<toLocalDateStr(new Date());
}
/* RDV à pointer visibles dans l'agenda : les journées archivées (masquées) sont exclues */
function aPointerList(){
  return S.history.filter(function(h){return isAPointer(h)&&S.permanences.some(function(p){return p.commune===h.commune&&p.exceptDate===h.date&&!p.archived;});});
}
/* pointage depuis la bannière 📌 : même enregistrement que le sélecteur de statut
   de la fenêtre RDV ; Excusé ouvre ensuite cette fenêtre pour saisir le motif */
function pointerStatut(h,statut){
  var targetP=h._profile||S.activeProfile;
  var arr=readProfileHistory(targetP);
  var idx=findHistIdx(arr,h);
  if(idx===-1)return;
  arr[idx].statut=statut;h.statut=statut;
  writeProfileHistory(targetP,arr);
  renderAgenda();renderTabs();
  if(statut==='excuse'){
    var perm=S.permanences.find(function(p){return p.commune===h.commune&&p.exceptDate===h.date;})||{commune:h.commune};
    S.modal='agenda-rdv';S.agendaRdv={slot:{heure:h.heure,taken:h},day:{dateStr:h.date,perm:perm}};renderModal();
  }
}
var DUREE_CRENEAU=60; /* durée fixe des créneaux, quelle que soit la commune */
var DEBUT_GRILLE=9*60+30; /* premier créneau à 9h30 puis toutes les heures (07/10/2026, avant : 9h00) */
var FIN_AFFICHAGE_DEFAUT=16*60+30; /* on continue de proposer des créneaux libres jusqu'à 16h30 même après le dernier RDV du jour */
function getSlots(commune,dateStr,historyList,permOverride){
  historyList=historyList||S.history;
  /* journée pas encore ouverte : grille par défaut (09:30-16:30) pour pouvoir quand même
     proposer un premier créneau — la journée n'est réellement ouverte/persistée qu'à
     l'enregistrement du RDV (ensureDayOpen), pas au simple affichage du picker */
  var perm=permOverride||getPermanence(commune,dateStr)||{debut:'09:30',fin:String(Math.floor(FIN_AFFICHAGE_DEFAUT/60)).padStart(2,'0')+':30'};
  var sh=parseInt(perm.debut),sm=parseInt(perm.debut.split(':')[1]||0);
  var eh=parseInt(perm.fin),em=parseInt(perm.fin.split(':')[1]||0);
  /* '09:00' = ancienne grille par défaut stockée sur les journées déjà ouvertes, pas un horaire
     choisi : elle passe à 9h30 comme les nouvelles. Seul un début personnalisé plus tôt est gardé.
     Les RDV déjà pris à l'heure pile restent affichés (extraHeures ci-dessous). */
  var permStart=sh*60+sm;
  var start=(perm.debut!=='09:00'&&permStart<DEBUT_GRILLE)?permStart:DEBUT_GRILLE,end=Math.max(eh*60+em,FIN_AFFICHAGE_DEFAUT);
  /* inclure aussi les RDV hors plage horaire — y compris une heure choisie « à la main »
     hors grille standard (ex: 9h15) */
  var extraHeures=historyList.filter(function(x){return x.date===dateStr&&(x.commune===commune||!x.commune);}).map(function(x){return x.heure;});
  /* la grille ne s'étire plus jusqu'à ces RDV (07/10/2026) : un RDV pris à 9h00 sur l'ancienne
     grille aurait fait repartir toute la journée de 9h00 ; il s'ajoute seul (boucle en fin de fonction) */
  var slots=[];
  var seenHeures={};
  function buildSlot(heure){
    if(seenHeures[heure])return;seenHeures[heure]=true;
    var matches=historyList.filter(function(x){return x.date===dateStr&&x.heure===heure&&(x.commune===commune||!x.commune);});
    var isFreed=function(x){return x.statut==='pas_de_retour'||x.statut==='lapin'||x.statut==='excuse';};
    /* une réservation libérée (excusé/lapin/pas de retour) ne doit jamais l'emporter face à une
       nouvelle réservation active sur le même créneau, quel que soit son type de message — sinon
       une relance (priorité basse) reste masquée derrière l'ancienne excusée (ex: proposition) */
    var activeMatches=matches.filter(function(x){return !isFreed(x);});
    var taken,multiPropo=false;
    if(activeMatches.length){
      var confirmations=activeMatches.filter(function(x){return x.msgType==='confirmation';});
      var propositions=activeMatches.filter(function(x){return x.msgType==='proposition';});
      var sansAppels=activeMatches.filter(function(x){return x.msgType==='sans_appel';});
      var relances=activeMatches.filter(function(x){return x.msgType==='relance';});
      var indispos=activeMatches.filter(function(x){return x.msgType==='indispo';});
      /* Les imports ICS utilisent « rdv » : ils occupent aussi leur créneau. */
      taken=confirmations[0]||propositions[0]||sansAppels[0]||relances[0]||indispos[0]||activeMatches[0]||null;
      multiPropo=confirmations.length===0&&propositions.length>1;
    } else {
      /* tous libérés : pas de notion de « plus engagé » entre plusieurs usagers différents
         sur le même créneau (trouvé 02/10/2026 — Boutin/Pergay, tous deux excusés, c'est
         Pergay qui ressortait au clic malgré Boutin plus récente) — on retient le plus
         récent, pas celui dont le type de message a le rang le plus haut. `matches`
         préserve l'ordre de S.history, toujours du plus récent au plus ancien. */
      taken=matches[0]||null;
    }
    var freeAgain=taken&&isFreed(taken);
    var replaced=matches.filter(function(x){return x!==taken&&isFreed(x);});
    slots.push({heure:heure,taken:taken||null,freeAgain:!!freeAgain,multiPropo:multiPropo,allPropo:propositions,replaced:replaced});
  }
  for(var t=start;t<=end;t+=DUREE_CRENEAU){
    var hh=String(Math.floor(t/60)).padStart(2,'0'),mm=String(t%60).padStart(2,'0');
    buildSlot(hh+':'+mm);
  }
  /* créneaux hors pas standard (heure modifiée manuellement) */
  extraHeures.forEach(function(h){if(!seenHeures[h])buildSlot(h);});
  slots.sort(function(a,b){return a.heure.localeCompare(b.heure);});
  return slots;
}
function hasConflict(date,heure,commune){
  return S.history.some(function(h){return h.date===date&&h.heure===heure&&(h.commune===commune||!h.commune)&&h.statut!=='pas_de_retour'&&h.statut!=='lapin'&&h.statut!=='excuse';});
}
/* même chose pour un profil qui n'est pas forcément le profil actif (RDV d'un collègue
   modifié depuis l'agenda partagé) */
function ensureDayOpenFor(profileId,commune,dateStr){
  if(profileId===S.activeProfile){ensureDayOpen(commune,dateStr);return;}
  if(!commune||!dateStr)return;
  var perms=ls(pkFor(profileId,'permanences'),[]);
  if(perms.some(function(p){return p.commune===commune&&p.exceptDate===dateStr;}))return;
  lsSet(pkFor(profileId,'permanences'),perms.concat([{id:Date.now()+Math.random(),commune:commune,exceptDate:dateStr,debut:'09:30',fin:'16:30'}]));
}
/* RDV en attente depuis plus de S.relanceDelai jours sans relance envoyée —
   formule centralisée ici pour éviter que les points d'affichage divergent entre eux */
function isInMyAgenda(h){
  /* vrai si le RDV tombe sur une journée ouverte (commune+date exacts) du profil actif */
  if(!h.date||!h.commune)return false;
  return S.permanences.some(function(p){return p.commune===h.commune&&p.exceptDate===h.date;});
}
function isDepasse(h){
  if(!h||h.statut!=='en_attente'||!h.dateDemande||h.dateRelance)return false;
  var t0=new Date();t0.setHours(0,0,0,0);
  return Math.round((t0-new Date(h.dateDemande.slice(0,10)+'T00:00:00'))/86400000)>(S.relanceDelai||3);
}
/* bloque un créneau libre pour indisponibilité (pas un usager) — profil actif uniquement */
function blockSlot(commune,dateStr,heure,motif){
  if(hasConflict(dateStr,heure,commune))return;
  ensureDayOpen(commune,dateStr);
  S.history.push({channel:'sms',msgType:'indispo',commune:commune,date:dateStr,heure:heure,nom:motif||'Indisponible',ts:new Date().toLocaleString('fr-FR')});
  lsSet(pk('history'),S.history);
}
/* libère un créneau bloqué */
function releaseSlot(entry){
  var idx=S.history.indexOf(entry);
  if(idx===-1)return;
  S.history.splice(idx,1);lsSet(pk('history'),S.history);
}
/* bloque tous les créneaux encore libres passés en paramètre en une fois */
function blockWholeDay(commune,dateStr,slots,motif){
  slots.forEach(function(s){if(!s.taken)blockSlot(commune,dateStr,s.heure,motif);});
}
function deletePerm(id){S.permanences=S.permanences.filter(function(p){return p.id!==id;});lsSet(pk('permanences'),S.permanences);renderConfig();}
function savePerm(id){
  var e=S.editPerm;if(!e||!e.commune.trim()||!e.exceptDate)return;
  S.permanences=S.permanences.map(function(p){return p.id===id?Object.assign({},p,{commune:e.commune.trim(),exceptDate:e.exceptDate,debut:e.debut,fin:e.fin}):p;});
  S.editPerm=null;lsSet(pk('permanences'),S.permanences);renderConfig();
}
/* masque (sans supprimer) les journées passées depuis longtemps, pour garder l'agenda lisible
   sans perdre l'historique ni les stats — n'archive jamais un jour qui a encore un RDV en
   attente (il doit rester visible tant qu'il n'est pas traité) */
function archiveOldDays(){
  var cutoff=toLocalDateStr(new Date(Date.now()-60*86400000));
  var n=0;
  S.permanences=S.permanences.map(function(p){
    if(p.archived||!p.exceptDate||p.exceptDate>=cutoff)return p;
    var pending=S.history.some(function(h){return h.commune===p.commune&&h.date===p.exceptDate&&(h.statut==='en_attente'||isAPointer(h));});
    if(pending)return p;
    n++;return Object.assign({},p,{archived:true});
  });
  lsSet(pk('permanences'),S.permanences);renderConfig();renderAgenda();
  showToast(n?('✓ '+n+' journée'+(n>1?'s':'')+' archivée'+(n>1?'s':'')):'Aucune journée à archiver');
}
function unarchiveDay(id){
  S.permanences=S.permanences.map(function(p){return p.id===id?Object.assign({},p,{archived:false}):p;});
  lsSet(pk('permanences'),S.permanences);renderConfig();
}

function doImport(){
  try{
    var data=JSON.parse(S.importText.trim());
    if(data.cmsList)S.cmsList=data.cmsList;if(data.demarches)S.demarches=data.demarches;if(data.secteurs)S.secteurs=data.secteurs;
    if(data.customTemplates)S.customTemplates=data.customTemplates;if(data.customVars)S.customVars=data.customVars;
    /* on n'importe pas les templates builtin — ils sont définis dans le code */
    /* cmsList est persisté via persist() ci-dessous (clé partagée entre profils) */
    if(data.mandats){S.mandats=data.mandats;lsSet('ess-mandats',S.mandats);}
    if(data.history){S.history=data.history;lsSet(pk('history'),S.history);}
    if(data.yearlyStats){S.yearlyStats=data.yearlyStats;lsSet(pk('yearly-stats'),S.yearlyStats);}
    if(data.permanences){S.permanences=migratePermanences(data.permanences,S.history);lsSet(pk('permanences'),S.permanences);lsSet(pk('perm-version'),PERM_MODEL_VERSION);}
    if(data.orientations){S.orientations=data.orientations;lsSet(pk('orientations'),S.orientations);}
    S.modal=null;S.importText="";S.importError="";
    persist();regen();renderAll();showToast("✅ Import réussi !");
  }catch(e){S.importError="❌ JSON invalide. Vérifiez la sauvegarde complète.";renderModal();}
}

function updatePartsLabel(){
  var lbl=document.getElementById('partsLabel');if(!lbl)return;
  var pi=partsInfo();
  var isUni=/[^\x00-\x7F€£¥]/.test(S.generatedBody)||/[Ā-￿]/.test(S.generatedBody);
  var single=isUni?70:160,multi=isUni?67:153;
  var limit=pi.parts<=1?single:multi;
  var progress=pi.parts<=1?pi.len:((pi.len-(pi.parts-1)*multi));
  lbl.textContent=pi.len+" / "+limit+" car. · "+pi.parts+" SMS";
  var bg=pi.parts===1?'oklch(0.95 0.04 155)':pi.parts===2?'oklch(0.96 0.05 85)':'oklch(0.96 0.04 25)';
  var fg=pi.parts===1?'oklch(0.42 0.12 155)':pi.parts===2?'oklch(0.5 0.1 70)':'oklch(0.52 0.16 25)';
  lbl.style.background=bg;lbl.style.color=fg;
  var bar=document.getElementById('parts-bar-inner');
  if(bar){
    var pct=Math.min(100,Math.round(progress/limit*100));
    var barCol=pi.parts===1?'oklch(0.62 0.14 155)':pi.parts===2?'oklch(0.7 0.15 85)':'oklch(0.6 0.17 25)';
    bar.style.width=pct+'%';bar.style.background=barCol;
  }
}

/* ============================== ARCHIVAGE ANNUEL (RGPD — rétention) ============================== */
/* Année d'une entrée d'historique : priorité à la date du RDV, sinon à la date d'envoi (ts). */
function entryYear(h){
  if(h.date){var y=parseInt(String(h.date).slice(0,4),10);if(y)return y;}
  if(h.ts){var m=String(h.ts).match(/(\d{2})\/(\d{2})\/(\d{4})/);if(m)return parseInt(m[3],10);}
  return null;
}
/* années révolues encore présentes (non archivées) dans l'historique du profil actif */
function yearsArchivable(){
  var curY=new Date().getFullYear();
  var found={};
  S.history.forEach(function(h){var y=entryYear(h);if(y&&y<curY)found[y]=(found[y]||0)+1;});
  return Object.keys(found).map(Number).sort(function(a,b){return b-a;}).map(function(y){return{year:y,count:found[y]};});
}
/* calcule l'archive agrégée et anonymisée d'une année (aucun nom/téléphone conservé) */
function computeYearArchive(year){
  var yEntries=S.history.filter(function(h){return entryYear(h)===year;});
  var hist=yEntries.filter(function(h){return h.msgType!=='indispo';});
  var arc={year:year,generatedAt:new Date().toISOString(),totalEntries:yEntries.length};
  arc.total=hist.length;
  arc.smsN=hist.filter(function(h){return h.channel==='sms';}).length;
  arc.mailN=hist.filter(function(h){return h.channel==='mail';}).length;
  var usagers={};hist.forEach(function(h){var k=(h.nom||'')+(h.prenom||'');if(k)usagers[k]=1;});
  arc.usagersN=Object.keys(usagers).length;
  var statutKeys=['confirme','en_attente','realise','excuse','lapin','pas_de_retour'];
  arc.statuts={};statutKeys.forEach(function(k){arc.statuts[k]=0;});
  hist.forEach(function(h){var k=h.statut||'en_attente';if(arc.statuts[k]===undefined)arc.statuts[k]=0;arc.statuts[k]++;});
  arc.realiseN=arc.statuts.realise||0;
  arc.lapinN=arc.statuts.lapin||0;
  var concretN=hist.filter(function(h){return h.date&&h.msgType!=='indispo';}).length;
  arc.concretPct=concretN>0?Math.round(arc.realiseN/concretN*100):null;
  arc.lapinPct=concretN>0?Math.round(arc.lapinN/concretN*100):null;
  var reactDiffs=[];hist.forEach(function(h){
    if(!h.dateDemande||!h.ts)return;
    var dem=new Date(h.dateDemande);
    var m=h.ts.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    var sendDate=m?new Date(parseInt(m[3],10),parseInt(m[2],10)-1,parseInt(m[1],10)):null;
    if(sendDate&&!isNaN(dem.getTime())&&sendDate>=dem)reactDiffs.push(Math.round((sendDate-dem)/86400000));
  });
  arc.avgReact=reactDiffs.length?Math.round(reactDiffs.reduce(function(s,d){return s+d;},0)/reactDiffs.length):null;
  var rdvDiffs=[];hist.forEach(function(h){
    if(!h.ts||!h.date)return;
    var m=h.ts.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    var tsDate=m?new Date(parseInt(m[3],10),parseInt(m[2],10)-1,parseInt(m[1],10)):null;
    var appt=new Date(h.date);
    if(tsDate&&!isNaN(appt.getTime())&&appt>tsDate)rdvDiffs.push(Math.round((appt-tsDate)/86400000));
  });
  arc.avgRdv=rdvDiffs.length?Math.round(rdvDiffs.reduce(function(s,d){return s+d;},0)/rdvDiffs.length):null;
  var monthMap={};
  hist.forEach(function(h){
    var raw=h.ts||'';var m=raw.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    var key=m?(m[3]+'-'+m[2]):raw.substring(0,7);
    if(!key)return;
    if(!monthMap[key])monthMap[key]={sms:0,mail:0};
    monthMap[key][h.channel==='mail'?'mail':'sms']++;
  });
  arc.byMonth=monthMap;
  var trendMap={};
  hist.forEach(function(h){
    if(!h.date||(h.statut!=='lapin'&&h.statut!=='excuse'&&h.statut!=='pas_de_retour'))return;
    var key=h.date.substring(0,7);
    if(!trendMap[key])trendMap[key]={lapin:0,excuse:0,pas_de_retour:0};
    trendMap[key][h.statut]++;
  });
  arc.trendByMonth=trendMap;
  var demMap={};hist.forEach(function(h){if(h.demarche)demMap[h.demarche]=(demMap[h.demarche]||0)+1;});
  arc.byDemarche=demMap;
  var typeMap={proposition:0,confirmation:0,sans_appel:0};
  hist.forEach(function(h){if(h.msgType&&typeMap[h.msgType]!==undefined)typeMap[h.msgType]++;});
  arc.byType=typeMap;
  var cmsMap={};hist.forEach(function(h){var c=h.commune||'';if(c)cmsMap[c]=(cmsMap[c]||0)+1;});
  arc.byCMS=cmsMap;
  var heatMap={};
  hist.filter(function(h){return h.date&&h.heure;}).forEach(function(h){
    var d=new Date(h.date+'T12:00:00');if(isNaN(d.getTime()))return;
    var k=d.getDay()+'|'+h.heure;
    heatMap[k]=(heatMap[k]||0)+1;
  });
  arc.heatmap=heatMap;
  return arc;
}
/* archive une année révolue puis purge son détail nominatif de l'historique du profil actif — irréversible, confirmation requise */
function archiveYear(year){
  var entries=S.history.filter(function(h){return entryYear(h)===year;});
  if(!entries.length){showToast('Aucune donnée pour '+year,'warn');return;}
  if(!confirm("Archiver l'année "+year+" ?\n\n"+entries.length+" entrée(s) d'historique seront résumées en statistiques agrégées et anonymisées, puis définitivement supprimées de l'historique nominatif. Cette action est irréversible."))return;
  var arc=computeYearArchive(year);
  S.yearlyStats[year]=arc;
  lsSet(pk('yearly-stats'),S.yearlyStats);
  var remaining=S.history.filter(function(h){return entryYear(h)!==year;});
  writeProfileHistory(S.activeProfile,remaining);
  showToast('✅ Année '+year+' archivée ('+entries.length+' RDV)');
  if(ghToken())githubPush(true);
  renderModal();renderAll();
}

/* ============================== RENDER: STATS ============================== */
function renderStats(){
  var pane=document.getElementById('pane-stats');if(!pane)return;clear(pane);
  var wrap=el('div',{class:'ui-stats-page'});

  if(!S.statsPeriod)S.statsPeriod='all';

  /* ── filtre de période ── */
  var now=new Date();
  function cutoff(p){
    if(p==='1m'){var d=new Date(now);d.setMonth(d.getMonth()-1);return d;}
    if(p==='3m'){var d=new Date(now);d.setMonth(d.getMonth()-3);return d;}
    if(p==='6m'){var d=new Date(now);d.setMonth(d.getMonth()-6);return d;}
    return null;
  }
  function inPeriod(h){
    var c=cutoff(S.statsPeriod);if(!c)return true;
    var raw=h.ts||"";var m=raw.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    var d=m?new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1])):new Date(h.date||"");
    return d>=c;
  }

/* ============================== RENDER: AGENDA ============================== */
function icsDate(dateStr,heureStr){
  /* dateStr=YYYY-MM-DD heureStr=HH:MM → 20260717T090000 (heure locale) */
  return (dateStr||'').replace(/-/g,'')+'T'+(heureStr||'00:00').replace(':','')+'00';
}
/* UID stable par RDV (indépendant de sa position dans S.history, qui change à
   chaque ajout puisque addHistory() insère en tête) — mêmes champs d'identité
   que la détection de doublon dans addHistory(), pour permettre à un logiciel
   de calendrier respectant l'UID de reconnaître un RDV déjà importé. */
function icsUidFor(h){
  var key=(h.date||'')+'|'+(h.heure||'')+'|'+(h.commune||'')+'|'+(h.nom||'').toLowerCase()+'|'+(h.prenom||'').toLowerCase();
  var hash=0;for(var i=0;i<key.length;i++){hash=((hash<<5)-hash+key.charCodeAt(i))|0;}
  return 'smsmail-'+Math.abs(hash)+'@ess';
}
/* couleur par CMS (ou par date si la commune manque) — propriété COLOR (RFC 7986),
   non garantie respectée par tous les logiciels de calendrier à l'import */
var ICS_COLOR_PALETTE=['red','blue','green','orange','purple','brown','teal','magenta','olive','navy'];
function icsColorFor(h){
  if(h.statut==='realise')return 'green';
  var key=h.commune||h.date||'';
  var hash=0;for(var i=0;i<key.length;i++){hash=((hash<<5)-hash+key.charCodeAt(i))|0;}
  return ICS_COLOR_PALETTE[Math.abs(hash)%ICS_COLOR_PALETTE.length];
}
/* échappe virgule/point-virgule/backslash pour une valeur de champ ICS (RFC 5545) */
function icsEscapeText(s){return String(s).replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function buildICS(rdvs){
  var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SMS-Mail//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  rdvs.forEach(function(h){
    var dtStart=icsDate(h.date,h.heure);
    /* durée 30 min par défaut */
    var parts=h.heure.split(':');var endMin=(parseInt(parts[0])*60+parseInt(parts[1]||0)+30);
    var dtEnd=icsDate(h.date,String(Math.floor(endMin/60)).padStart(2,'0')+':'+String(endMin%60).padStart(2,'0'));
    var who=[h.civilite,h.prenom,h.nom].filter(Boolean).join(' ')||'Bénéficiaire';
    var summary=who+(h.commune?' — RDV '+h.commune:' — RDV');
    var desc=(h.demarche||'')+(h.telephone?'\\nTél : '+h.telephone:'')+(h.notes?'\\nNotes : '+h.notes:'');
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+icsUidFor(h));
    lines.push('DTSTART;TZID=Europe/Paris:'+dtStart);
    lines.push('DTEND;TZID=Europe/Paris:'+dtEnd);
    lines.push('SUMMARY:'+summary);
    if(ICS_CANCEL_STATUTS.indexOf(h.statut)!==-1)lines.push('STATUS:CANCELLED');
    else if(h.statut==='realise')lines.push('STATUS:CONFIRMED');
    lines.push('COLOR:'+icsColorFor(h));
    if(desc)lines.push('DESCRIPTION:'+desc);
    if(h.commune){
      /* "CMS de [commune]" sans accent ni caractère spécial, pour la segmentation d'envoi de SMS Reminder */
      var cleanCommune=h.commune.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9 -]/g,'').trim();
      lines.push('LOCATION:'+icsEscapeText('CMS de '+cleanCommune));
    }
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadICS(icsText,filename){
  var blob=new Blob([icsText],{type:'text/calendar;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);
}
/* statuts qui annulent un RDV auparavant confirmé — exportés en STATUS:CANCELLED
   plutôt qu'omis, pour que la ré-importation dans Google Agenda retire l'événement
   déjà présent (confirmé par un test réel d'import sur SMS-mail) */
var ICS_CANCEL_STATUTS=['excuse','lapin','pas_de_retour'];
/* seuls les RDV confirmés (à venir), réalisés (passés) ou annulés après coup
   (excusé/lapin/pas de retour, exportés en CANCELLED) ont vocation à apparaître
   sur un calendrier externe — les propositions encore en attente ne sont pas
   exportées ; les créneaux bloqués (indispo) le restent, ce n'est pas un statut
   de RDV mais du temps réellement indisponible. */
/* les blocages internes (indispo) ne sont pas exportés — libellés génériques quasi identiques
   au même horaire, ça perturbait visiblement l'import de gros lots dans Google Agenda */
function icsExportable(h){return h.msgType!=='indispo'&&(h.statut==='confirme'||h.statut==='realise'||ICS_CANCEL_STATUTS.indexOf(h.statut)!==-1);}
function exportICS(){
  var rdvs=S.history.filter(function(h){return h.date&&h.heure&&icsExportable(h);});
  if(!rdvs.length){showToast('Aucun RDV confirmé à exporter','warn');return;}
  downloadICS(buildICS(rdvs),'permanences-ess.ics');
  showToast('✅ '+rdvs.length+' RDV exportés');
}
/* export ICS d'une seule journée (commune+date) — pratique pour tester un import
   Google Agenda sur un périmètre limité avant de faire un export complet */
function exportICSDay(commune,dateStr){
  var rdvs=S.history.filter(function(h){return h.date===dateStr&&h.commune===commune&&h.heure&&icsExportable(h);});
  if(!rdvs.length){showToast('Aucun RDV confirmé à exporter pour cette journée','warn');return;}
  var safeCommune=(commune||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-');
  downloadICS(buildICS(rdvs),'permanence-'+safeCommune+'-'+dateStr+'.ics');
  showToast('✅ '+rdvs.length+' RDV exportés pour cette journée');
}
function importICSText(text){
  var events=text.split('BEGIN:VEVENT').slice(1);
  var added=0;
  events.forEach(function(ev){
    var get=function(k){var m=ev.match(new RegExp(k+'[^:]*:([^\\r\\n]+)'));return m?m[1].trim():'';};
    var dtRaw=get('DTSTART');
    if(!dtRaw)return;
    var dateStr=dtRaw.slice(0,4)+'-'+dtRaw.slice(4,6)+'-'+dtRaw.slice(6,8);
    var heureStr=dtRaw.slice(9,11)+':'+dtRaw.slice(11,13);
    var summary=get('SUMMARY').replace(/\\,/g,',');
    var desc=(get('DESCRIPTION')||'').replace(/\\n/g,'\n');
    var location=get('LOCATION');
    /* éviter doublons */
    var dup=S.history.find(function(h){return h.date===dateStr&&h.heure===heureStr&&(h.commune===location||!location);});
    if(dup)return;
    addHistory({channel:'sms',msgType:'rdv',body:'',subject:'',civilite:'',prenom:'',nom:summary,telephone:'',demarche:'',commune:location,selectedCMS:'',date:dateStr,heure:heureStr,notes:desc,ts:new Date().toLocaleString('fr-FR')});
    added++;
  });
  return added;
}
function importPlanningJson(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(){
    var file=inp.files[0];if(!file)return;
    var fr=new FileReader();fr.onload=function(e){
      try{
        var entries=JSON.parse(e.target.result);
        if(!Array.isArray(entries))throw new Error();
        var added=0;
        entries.forEach(function(entry){
          /* dédup : même date + heure + nom (insensible casse) */
          var dup=S.history.find(function(h){
            return h.date===entry.date&&(h.nom||'').toLowerCase()===(entry.nom||'').toLowerCase();
          });
          if(dup){S.history.splice(S.history.indexOf(dup),1,Object.assign({},dup,entry));return;};
          addHistory(Object.assign({channel:'sms',msgType:'confirmation',body:'',subject:'',civilite:'',prenom:'',nom:'',telephone:'',demarche:'',selectedDemarche:'',demarcheAutre:'',commune:'',selectedCMS:'',date:'',heure:'',dateDemande:'',ts:''},entry,{ts:''}));
          added++;
        });
        lsSet(pk('history'),S.history);
        renderAgenda();renderTabs();
        showToast('✅ '+added+' RDV importé(s)'+(entries.length-added>0?' · '+(entries.length-added)+' doublon(s) ignoré(s)':''));
      }catch(ex){showToast('⚠️ Fichier JSON invalide','warn');}
    };fr.readAsText(file);
  };inp.click();
}
/* ── rappel la veille + doublons de fiche (10/10/2026) ──
   rappel : RDV encore actifs du prochain jour ouvré (lundi si on est vendredi), avec le SMS

              pill.style.transition='transform 200ms ease';pill.style.transform='translateX(-100%)';
              setTimeout(function(){
                if(confirm('Supprimer ce RDV ?')){
                  var targetP=s.taken._profile||S.activeProfile;
                  var arr=readProfileHistory(targetP);
                  var idx=findHistIdx(arr,s.taken);
                  if(idx!==-1){arr.splice(idx,1);writeProfileHistory(targetP,arr);}
                  renderAgenda();showToast('🗑 RDV supprimé');
                } else {pill.style.transition='transform 200ms ease';pill.style.transform='';}
              },200);
            }
          },{passive:true});
        }
      })(slot,day);
      slotList.appendChild(pill);
    });

      if(!halfdayLists[period].children.length)halfdayLists[period].appendChild(el('p',{class:'ui-ag-halfday-empty'},'Aucun RDV'));
    });
    card.appendChild(sg);
    board.appendChild(card);
  });

}

/* normalise un nom de commune pour détecter les quasi-doublons (espace/tiret/accent) */
function normCommune(s){
  return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[-\s']+/g,' ').trim();
}
/* repère les noms de commune qui désignent la même chose sous des orthographes différentes,
   à travers CMS/secteurs/permanences/historique (profil actif) — cause déjà vécue d'un bug
   de créneaux (durée figée à 30 min faute de retrouver la permanence régulière correspondante) */
function communeSpellingIssues(){
  var groups={};
  function add(raw){
    if(!raw)return;
    var key=normCommune(raw);if(!key)return;
    if(!groups[key])groups[key]={};
    groups[key][raw]=1;
  }
  (S.cmsList||[]).forEach(function(c){add(c.nom);});
  (S.secteurs||[]).forEach(add);
  (S.permanences||[]).forEach(function(p){add(p.commune);});
  (S.history||[]).forEach(function(h){add(h.commune);});
  var issues=[];
  Object.keys(groups).forEach(function(k){
    var variants=Object.keys(groups[k]).sort();
    if(variants.length>1)issues.push(variants);
  });
  return issues;
}
function renderConfig(){
  var pane=document.getElementById('pane-config');clear(pane);
  var wrap=el('div',{class:'ui-tool-screen ui-settings'});
  var communeIssues=communeSpellingIssues();
  if(communeIssues.length){
    var warnBox=el('div',{style:"background:oklch(0.97 0.04 75);border:1px solid oklch(0.85 0.06 75);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;color:oklch(0.42 0.1 75);line-height:1.6;"});
    warnBox.appendChild(el('div',{style:"font-weight:700;margin-bottom:4px;"},"⚠️ Orthographes de commune divergentes détectées"));
    communeIssues.forEach(function(variants){
      warnBox.appendChild(el('div',{},variants.map(function(v){return '"'+v+'"';}).join(' ≠ ')));
    });
    warnBox.appendChild(el('div',{style:"margin-top:6px;"},"Ces variantes désignent probablement le même endroit mais ne sont pas reconnues comme identiques par l'app (créneaux, statistiques, agenda) — harmonisez l'orthographe dans CMS/secteurs/permanences/historique."));
    wrap.appendChild(warnBox);
  }
  var tabs=el('nav',{class:'ui-settings-nav','aria-label':'Rubriques de configuration'});
  [["cms","Adresses CMS ("+S.cmsList.length+")"],["secteurs","CMS ("+S.secteurs.length+")"],["demarches","Démarches ("+S.demarches.length+")"],["permanences","Journées ("+S.permanences.length+")"],["general","Général"]].forEach(function(c){
    tabs.appendChild(el('button',{class:'gx-press ui-settings-tab','aria-current':S.configTab===c[0]?'page':null,onClick:function(){S.configTab=c[0];renderConfig();}},c[1]));
  });
  var layout=el('div',{class:'ui-settings-layout'});
  var content=el('div',{class:'ui-settings-content'});
  var records=el('div',{class:'ui-settings-records','data-section':S.configTab});
  var createPane=el('aside',{class:'ui-settings-create'});
  var collectionTitles={cms:['Adresses enregistrées',S.cmsList.length],secteurs:['CMS enregistrés',S.secteurs.length],demarches:['Catalogue des démarches',S.demarches.length],permanences:['Journées d’ouverture',S.permanences.length]};

}
function archiveMandat(){
  if(!S.mandatNom&&!S.mandatPrenom){showToast("Renseignez au moins un nom","warn");return;}
  var item={
    id:Date.now(),
    civilite:S.mandatCivilite,prenom:S.mandatPrenom,nom:S.mandatNom,
    commune:S.mandatCommune,num:S.mandatNum,
    structure:STRUCTURE,duree:DUREE,
    date:todayFR(),ts:new Date().toLocaleString('fr-FR')
  };
  S.mandats=[item].concat(S.mandats);
  lsSet('ess-mandats',S.mandats);
  showToast("✓ Mandat archivé");
  renderMandats();
}

/* ============================== MANDATS ARCHIVÉS ============================== */
function renderMandats(){
  var pane=document.getElementById('pane-mandats');clear(pane);
  var wrap=el('div',{class:'ui-tool-screen ui-archive'});
  var head=el('div',{class:'ui-archive-toolbar'});
  head.appendChild(el('div',{},[el('h2',{},'Documents conservés'),el('span',{},S.mandats.length+' mandat'+(S.mandats.length>1?'s':''))]));
  if(S.mandats.length)head.appendChild(el('button',{class:'gx-press ui-archive-clear',onClick:function(){if(confirm('Vider tous les mandats archivés ?')){S.mandats=[];lsSet('ess-mandats',[]);renderMandats();}}},'Vider les archives'));
  wrap.appendChild(head);
  if(!S.mandats.length){
    wrap.appendChild(el('div',{class:'ui-empty-state'},[workspaceIcon('archive'),el('h3',{},'Vos mandats apparaîtront ici'),el('p',{},'Après avoir préparé un mandat, utilisez « Archiver » pour le retrouver dans cette liste.'),el('button',{class:'gx-press ui-archive-create',onClick:function(){S.activeTab='mandat';renderTabs();showActivePane();renderMandat();}},'Préparer un mandat')]));
  }else{
    var list=el('div',{class:'ui-archive-register'});
    list.appendChild(el('div',{class:'ui-archive-columns'},[el('span',{},'Bénéficiaire'),el('span',{},'Lieu et archivage'),el('span',{},'Document')]));
    S.mandats.forEach(function(m){
      var full=[m.civilite,m.prenom,(m.nom||'').toUpperCase()].filter(Boolean).join(' ');
      var row=el('article',{class:'ui-archive-row'});
      row.appendChild(el('div',{class:'ui-archive-identity'},[workspaceIcon('document'),el('div',{},[el('strong',{},full||'(sans nom)'),el('small',{},m.num||'Mandat d’accompagnement')])]));
      var meta=el('div',{class:'ui-archive-meta'},[el('strong',{},m.commune||'Lieu non renseigné'),el('span',{},m.date+' · archivé le '+m.ts)]);
      if(m.aidant)meta.appendChild(el('span',{},'Aidant : '+m.aidant));
      row.appendChild(meta);
      row.appendChild(el('button',{class:'gx-press ui-archive-regenerate',onClick:function(){regenMandat(m);}},'Régénérer le mandat'));
      list.appendChild(row);
    });
    wrap.appendChild(list);
  }
  pane.appendChild(wrap);
}
function regenMandat(m){
  S.mandatSource="";
  S.mandatCivilite=m.civilite||"";S.mandatPrenom=m.prenom||"";S.mandatNom=m.nom||"";
  S.mandatNum=m.num||"";S.mandatCommune=m.commune||"";
  S.activeTab="mandat";
  renderTabs();showActivePane();renderMandat();
}

/* ============================== ORIENTATIONS ============================== */
/* async xlsx parser using DecompressionStream (deflate-raw) */
function parseXlsxOrientationsAsync(arrayBuffer){
  return new Promise(function(resolve,reject){
    var bytes=new Uint8Array(arrayBuffer);

    /* 1. index all local file entries */
    var entries={};
    var i=0;
    while(i<bytes.length-3){
      if(bytes[i]===0x50&&bytes[i+1]===0x4B&&bytes[i+2]===0x03&&bytes[i+3]===0x04){
        var comp=bytes[i+8]|(bytes[i+9]<<8);
        var csize=(bytes[i+18])|(bytes[i+19]<<8)|(bytes[i+20]<<16)|(bytes[i+21]<<24);
        var usize=(bytes[i+22])|(bytes[i+23]<<8)|(bytes[i+24]<<16)|(bytes[i+25]<<24);
        var fnlen=(bytes[i+26])|(bytes[i+27]<<8);
        var exlen=(bytes[i+28])|(bytes[i+29]<<8);
        var fnBytes=bytes.slice(i+30,i+30+fnlen);
        var fname='';for(var fj=0;fj<fnBytes.length;fj++)fname+=String.fromCharCode(fnBytes[fj]);
        var dataStart=i+30+fnlen+exlen;
        entries[fname]={comp:comp,raw:bytes.slice(dataStart,dataStart+csize),usize:usize};
        i=dataStart+Math.max(csize,0);
      } else {i++;}
    }

    /* 2. inflate one entry (comp 8 → deflate-raw, comp 0 → store) */
    function inflateEntry(name){
      var entry=entries[name];
      if(!entry)return Promise.resolve(null);
      if(entry.comp===0){
        var buf=entry.raw.buffer.slice(entry.raw.byteOffset,entry.raw.byteOffset+entry.raw.byteLength);
        return Promise.resolve(new TextDecoder('utf-8').decode(new Uint8Array(buf)));
      }
      if(typeof DecompressionStream==='undefined'){return Promise.resolve(null);}
      try{
        var ds=new DecompressionStream('deflate-raw');
        var writer=ds.writable.getWriter();
        var reader=ds.readable.getReader();
        writer.write(entry.raw);writer.close();
        var chunks=[];
        function read(){return reader.read().then(function(r){if(r.done)return;chunks.push(r.value);return read();});}
        return read().then(function(){
          var total=chunks.reduce(function(s,c){return s+c.length;},0);
          var out=new Uint8Array(total);var off=0;
          chunks.forEach(function(c){out.set(c,off);off+=c.length;});
          return new TextDecoder('utf-8').decode(out);
        });
      }catch(ex){return Promise.resolve(null);}
    }

    /* 3. parse xml helpers */
    function xmlAttr(str,attr){var m=str.match(new RegExp(attr+'="([^"]*)"'));return m?m[1]:'';}
    function parseSharedStrings(xml){
      var ss=[];var siRe=/<si>([\s\S]*?)<\/si>/g;var sm;
      while((sm=siRe.exec(xml))!==null){
        var tRe=/<t[^>]*>([^<]*)<\/t>/g;var tm;var parts=[];
        while((tm=tRe.exec(sm[1]))!==null)parts.push(tm[1]);
        ss.push(parts.join(''));
      }
      return ss;
    }
    function parseSheet(xml,ss){
      function cellVal(attrs,inner){
        var t=xmlAttr(attrs,'t');var vm=inner.match(/<v>([^<]*)<\/v>/);if(!vm)return '';
        var v=vm[1];return t==='s'?(ss[parseInt(v)]||''):v;

      var colNomPrenom=findCol(hdr,['nom']);

      var colPrenom=findCol(hdr,['prénom','prenom']);

          orienteur:(colOrienteur?c[colOrienteur]||'':'').trim(),
          date:dateRaw?excelDate(dateRaw):'',
          etat:(colEtat?c[colEtat]||'':'').trim()

      }
      resolve(results);
    }).catch(function(ex){reject(ex);});
  });
}

function confirmOrientImport(){
  var rows=S.orientImportRows||[];
  var byProfile={};
  var skipped=0;
  rows.filter(function(r){return r.include;}).forEach(function(r){
    if(!r.targetProfile){skipped++;return;}
    var obj={id:r.id,nom:r.nom,prenom:r.prenom,telephone:r.telephone||'',commune:r.structure||'',communeBenef:r.communeBenef,motif:r.motif,orienteur:r.orienteur,date:r.date,etat:r.etat,done:false};
    (byProfile[r.targetProfile]=byProfile[r.targetProfile]||[]).push(obj);
  });
  var totalAdded=0;
  var breakdown=[];
  Object.keys(byProfile).forEach(function(pid){
    var arr=readProfileOrientations(pid).slice();
    var existIds=arr.map(function(o){return o.id;});
    var fresh=byProfile[pid].filter(function(o){return existIds.indexOf(o.id)===-1;});
    arr=arr.concat(fresh);
    writeProfileOrientations(pid,arr);
    totalAdded+=fresh.length;
    if(fresh.length>0){var pf=getProfile(pid);breakdown.push((pf?pf.nom:pid)+' ('+fresh.length+')');}
  });
  S.orientImportRows=null;S.orientImportCmsFilter='';S.orientImportBulkTarget='';S.modal=null;
  renderOrientations();renderTabs();renderModal();
  var msg;

  } else {
    msg='✅ '+totalAdded+' orientation(s) ajoutée(s) — '+breakdown.join(', ');
  }
  if(skipped>0)msg+=' — ⚠️ '+skipped+' ignorée(s) (conseiller non choisi)';
